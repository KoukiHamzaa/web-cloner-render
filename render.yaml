services:
  - type: web
    name: web-cloner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DOWNLOAD_QUOTA
        value: 100m
      - key: DOWNLOAD_TIMEOUT_MS
        value: 300000
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      - key: JOB_COOLDOWN_MS
        value: "15000"
      - key: ALLOWED_ORIGINS
        value: https://web-cloner-x3a3.onrender.com
