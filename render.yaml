services:
  - type: web
    name: web-cloner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DOWNLOAD_QUOTA
        value: 100m
      - key: DOWNLOAD_TIMEOUT_MS
        value: 300000
