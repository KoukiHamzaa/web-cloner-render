name: Sync Render Mirror

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to public render mirror
        id: mirror
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_RENDER_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add mirror git@github.com:KoukiHamzaa/web-cloner-render.git
          git fetch mirror master 2>/dev/null || true
          LOCAL=$(git rev-parse master)
          REMOTE=$(git rev-parse mirror/master 2>/dev/null || echo "none")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Mirror already in sync — skipping."
          else
            git push --force mirror master:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Mirror updated to $LOCAL"
          fi