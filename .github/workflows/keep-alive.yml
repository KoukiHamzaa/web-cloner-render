name: Keep Render Service Awake

on:
  schedule:
    # Render's free tier spins the service down after 15 minutes of inactivity.
    # Pinging every 10 minutes keeps it warm while leaving headroom for GitHub
    # Actions schedule drift (cold starts take ~60s, so stay well under 15min).
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://web-cloner-x3a3.onrender.com/healthz || echo "000")
          echo "Render health check returned: $response"
          if [ "$response" != "200" ]; then
            echo "::warning::Render service returned $response (may still be cold-starting)"
          fi